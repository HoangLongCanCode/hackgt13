# Realtime Perception Engine config (KSR AI Spatial Driving Copilot, HackGT 13).
# Loaded by perception.engine.PerceptionEngine and perception.realtime.server (--config).
# Anything left out falls back to perception/engine.py DEFAULTS.
#
# lanes_mode two_lane (protocol v2, the realtime server): two threads, results in two waves.
#   FAST lane, every analysed frame : detect + track + lights (+ geometry-only distance for objects without a
#                                     fresh slow-lane one)                         -> perception.frame (wave 1)
#   SLOW lane, back to back         : distance (DA3 depth network every `slow_schedule.depth.every`-th cycle, geometry
#                                     + per-track Kalman in between), lanes + road, signs -> perception.update (wave 2)
#   Measured on the city clip b1ff4656-0435391e (RTX 5060 Laptop, solo GPU, perception/realtime/README.md):
#   wave 1 ~17-22 Hz, wave 2 / distance ~8-13 Hz.
# lanes_mode serial (engine.step, offline tools): the `every` / `phase` fields of the blocks below are used instead:
#   a block runs on analysed step k when k % every == phase % every and its output is carried forward in between.

target_hz: 16            # expected analysed-frame rate: sizes tracker buffers / class vote (in frames)
device: cuda

input:                   # serial mode: frames of another size are centre-cropped to 16:9 and resized
  width: 1280
  height: 720
  max_width: 1280        # two-lane: a stream wider than this is scaled down (intrinsics scaled with it)

camera:
  focal_px: 700.0        # at 1280 px width, scaled to the frame width (BDD100K publishes no intrinsics)
  cam_height_m: null     # null = estimated from the DA3 road profile

detection:               # plan section 7, every step
  weights: bdd-yolo26s
  imgsz: 960
  conf: 0.25

tracking:                # plan section 8, every step (vehicles, pedestrians, riders)
  backend: ul_botsort    # GMC sparseOptFlow at the default downscale 2: ~7 ms CPU alone
  track_buffer_s: 2.0
  class_vote_s: 0.5
  opts: {}               # e.g. {gmc_downscale: 4} saves ~1 ms here for about -1 IDF1

static_tracking:         # traffic lights + signs; ids offset by 1,000,000
  backend: ul_bytetrack
  harmonised: false      # Ultralytics bytetrack.yaml thresholds (0.25 / 0.1 / 0.25), as in the traffic e2e runs
  track_buffer_s: 1.0

depth:                   # plan section 9; network on even steps, geometry + per-track Kalman on odd steps
  enabled: true
  backend: da3_metric_large
  every: 2
  hood_freeze_after: 12  # depth runs of 'auto' hood detection before the hood row is frozen for the video

lanes:                   # plan section 10 + lane-based RoadGeometry (section 13)
  enabled: true
  backend: twinlitenetplus_large
  every: 2
  phase: 1

lights:                  # plan section 11, every step on light tracks
  enabled: true
  backend: autoware_onnx
  device: cuda
  orient: auto
  smoothing: hmm
  track_stride: 1
  fixed_batch: 8          # ORT CUDA EP pays ~22 ms per input-shape change: always run batches of 8

signs:                   # plan section 12; typed class carried per track id between runs
  enabled: true
  backend: lisa_crops
  every: 4
  phase: 1
  emit_unknown: false
  ocr: pp_ocrv6_small
  ocr_device: cpu        # CUDA EP autotunes per text-line width (up to 255 ms spikes); CPU is 2.5-8 ms

segmentation:            # plan section 13 semantic road geometry: off (lanes already yields RoadGeometry)
  enabled: false
  backend: efficientvit_b1
  every: 3
  phase: 0

openpilot:
  enabled: false         # experimental block, not wired into realtime

warmup: true

# ---- two-lane realtime schedule (protocol v2)
lanes_mode: two_lane     # two_lane (realtime server) | serial (engine.step)
fast:
  max_hz: null           # wave-1 rate cap (null = every frame the lane can take)
  cuda_priority: -5      # higher-priority CUDA stream than the slow lane
  geometry_distance: true   # size prior + flat ground for vehicles / pedestrians without a fresh fused distance
slow:
  max_hz: null           # wave-2 rate cap (null = back to back)
  cuda_priority: 0
  max_distance_age_s: 1.0   # wave 1 stops carrying a slow-lane distance older than this (geometry takes over)
slow_schedule:           # counted in slow-lane cycles
  depth: {every: 1}      # DA3 network on every cycle
  lanes: {every: 1, phase: 0}
  signs: {every: 2, phase: 1}
  segmentation: {every: 3, phase: 0}
gil_switch_interval_ms: 1.0
